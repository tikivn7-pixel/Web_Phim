<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xem Phim - Netfilm</title>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Plyr CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"
    />
    <!-- Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Plyr JS -->
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

    <style>
      body {
        background-color: #141414;
        color: #fff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      .watch-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .back-btn {
        display: inline-block;
        color: #fff;
        text-decoration: none;
        margin-bottom: 15px;
        font-size: 1rem;
      }
      .back-btn i {
        margin-right: 5px;
      }

      /* WRAPPER VÀ FIX TOÀN MÀN HÌNH DI ĐỘNG */
      .video-wrapper {
        position: relative;
        width: 100%;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        aspect-ratio: 16/9;
      }
      video {
        width: 100%;
        height: 100%;
      }

      /* Tối ưu hóa chế độ Fullscreen chống kẹt khung dọc trên mobile & web */
      .video-wrapper:fullscreen,
      .video-wrapper:-webkit-full-screen,
      .video-wrapper:-moz-full-screen {
        width: 100vw !important;
        height: 100vh !important;
        max-width: none !important;
        max-height: none !important;
        border-radius: 0 !important;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000 !important;
      }

      .video-wrapper video:fullscreen,
      .video-wrapper video:-webkit-full-screen,
      .video-wrapper video:-moz-full-screen {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: contain !important;
        border-radius: 0 !important;
      }

      .movie-info {
        margin-top: 20px;
      }
      .movie-info h1 {
        font-size: 1.8rem;
        margin-bottom: 5px;
      }
      .movie-info p {
        color: #aaa;
        font-size: 1.1rem;
      }

      /* Khung chọn tập nhanh */
      .episodes-section {
        margin-top: 30px;
      }
      .episodes-section h3 {
        margin-bottom: 15px;
      }
      .episode-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        max-height: 200px;
        overflow-y: auto;
      }
      .ep-btn {
        background: #333;
        color: #fff;
        border: none;
        padding: 8px 14px;
        border-radius: 4px;
        cursor: pointer;
        transition: 0.2s;
      }
      .ep-btn:hover {
        background: #555;
      }
      .ep-btn.active {
        background: #e50914;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="watch-container">
      <!-- Nút quay lại trang chủ hoặc trang chi tiết -->
      <a href="index.html" class="back-btn"
        ><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</a
      >

      <div class="video-wrapper" id="video-wrapper-box">
        <video id="video-player" controls playsinline></video>
      </div>

      <div class="movie-info">
        <h1 id="watch-movie-title">Đang tải tên phim...</h1>
        <p id="current-ep-title">Tập 1</p>
      </div>

      <div class="episodes-section">
        <h3>Danh sách tập</h3>
        <div id="watch-episode-grid" class="episode-grid">
          <!-- Danh sách nút tập phim sẽ được render tự động -->
        </div>
      </div>
    </div>

    <!-- Nạp dữ liệu phim và episodes.js trước -->
    <script src="Episodes.js"></script>
    <script src="script.js"></script>

    <!-- Đoạn script xử lý đọc URL, lấy link API, phát video và tương thích thiết bị di động -->
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const params = new URLSearchParams(window.location.search);
        const movieTitle = params.get("title");
        const episodeNum = parseInt(params.get("ep")) || 1;
        const slug = params.get("slug") || "";

        if (!movieTitle) {
          document.getElementById("watch-movie-title").innerText =
            "Không tìm thấy thông tin phim!";
          return;
        }

        // Cập nhật tiêu đề giao diện
        document.getElementById("watch-movie-title").innerText = movieTitle;
        document.getElementById("current-ep-title").innerText =
          `Tập ${episodeNum}`;

        // Tìm tổng số tập của phim
        const movieObj = globalMoviesList.find(
          (m) => m.title.toLowerCase() === movieTitle.toLowerCase(),
        );
        const totalEp = getTotalEpisodes(movieObj);

        // Render danh sách tập phim ở dưới video
        const grid = document.getElementById("watch-episode-grid");
        grid.innerHTML = "";
        for (let i = 1; i <= totalEp; i++) {
          const btn = document.createElement("button");
          btn.className = `ep-btn ${i === episodeNum ? "active" : ""}`;
          btn.innerText = `Tập ${i}`;
          btn.onclick = () => {
            window.location.href = `watch.html?title=${encodeURIComponent(movieTitle)}&ep=${i}&slug=${slug}`;
          };
          grid.appendChild(btn);
        }

        // Lấy link video từ episodes.js hoặc gọi API phimapi.com
        let videoSrc = "";
        const cleanTitle = movieTitle.trim().toLowerCase();
        const key = movieKeyMap[cleanTitle];

        if (key && window.allEpisodesData && window.allEpisodesData[key]) {
          videoSrc = window.allEpisodesData[key][episodeNum - 1] || "";
        }

        if (!videoSrc && slug) {
          try {
            const response = await fetch(`https://phimapi.com/phim/${slug}`);
            const data = await response.json();
            if (data && data.episodes && data.episodes[0]) {
              const epList = data.episodes[0].server_data;
              if (epList[episodeNum - 1]) {
                videoSrc = epList[episodeNum - 1].link_m3u8;
              }
            }
          } catch (err) {
            console.error("Lỗi khi tải API phim:", err);
          }
        }

        // Fallback nếu không tìm thấy link
        if (!videoSrc) {
          videoSrc = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";
        }

        // Khởi tạo phát video với HLS.js và Plyr
        const video = document.getElementById("video-player");
        if (typeof Hls !== "undefined" && Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(videoSrc);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video
              .play()
              .catch((err) => console.log("Tự động phát bị chặn:", err));
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = videoSrc;
          video.addEventListener("loadedmetadata", () => {
            video
              .play()
              .catch((err) => console.log("Tự động phát bị chặn:", err));
          });
        }

        const player = new Plyr(video, {
          controls: [
            "play-large",
            "play",
            "rewind",
            "fast-forward",
            "progress",
            "current-time",
            "duration",
            "mute",
            "volume",
            "captions",
            "settings",
            "pip",
            "airplay",
            "fullscreen",
          ],
        });

        // Bổ sung xử lý sự kiện nút Fullscreen cho thiết bị iOS Safari di động
        player.on("enterfullscreen", () => {
          if (video.webkitEnterFullscreen && !document.fullscreenElement) {
            video.webkitEnterFullscreen();
          }
        });
      });
    </script>
  </body>
</html>
