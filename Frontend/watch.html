<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Xem Phim - Netfilm</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Plyr CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"
    />
    <!-- Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Plyr JS -->
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
  </head>
  <body>
    <div class="fd-wrap">
      <!-- Breadcrumb -->
      <div class="fd-breadcrumb" id="fd-breadcrumb">
        <a href="index.html">Trang chủ</a>
      </div>

      <div class="fd-layout">
        <!-- ================= MAIN ================= -->
        <div class="fd-main">
          <!-- Player -->
          <div class="wp-player-card">
            <div class="video-wrapper" id="video-wrapper-box">
              <video id="video-player" controls playsinline></video>
            </div>
            <div class="wp-player-toolbar">
              <div class="wp-now-playing">
                <h1 id="watch-movie-title">Đang tải tên phim...</h1>
                <p id="current-ep-title">Tập 1</p>
              </div>
              <div class="wp-nav-btns">
                <button id="wp-prev-btn" class="wp-nav-btn">
                  <i class="fa-solid fa-backward-step"></i> Tập trước
                </button>
                <label class="wp-autonext">
                  <input type="checkbox" id="wp-autonext-toggle" checked />
                  Tự động chuyển tập
                </label>
                <button id="wp-next-btn" class="wp-nav-btn">
                  Tập sau <i class="fa-solid fa-forward-step"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Phần phim (nếu cùng group, dùng chung hàm renderMovieParts) -->
          <div id="parts-section" style="display: none; margin-bottom: 20px">
            <h3
              style="
                border-bottom: 2px solid #e50914;
                display: inline-block;
                padding-bottom: 5px;
                margin-bottom: 12px;
              "
            >
              Phần Phim
            </h3>
            <div
              id="detail-parts-grid"
              style="display: flex; flex-wrap: wrap; gap: 10px"
            ></div>
          </div>

          <!-- Danh sách tập -->
          <div class="episodes-section">
            <div class="wp-ep-header">
              <h3 style="margin: 0">Danh Sách Tập</h3>
              <div class="wp-ep-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                  type="text"
                  id="wp-ep-search-input"
                  placeholder="Tìm tập..."
                />
              </div>
            </div>
            <div class="wp-episode-scroll">
              <div id="watch-episode-grid" class="episode-grid"></div>
            </div>
          </div>

          <!-- Mini info phim -->
          <div class="wp-movie-mini">
            <img id="wp-mini-poster" src="" alt="Poster" />
            <div class="wp-mini-info">
              <h4 id="wp-mini-title"></h4>
              <p class="wp-mini-genres" id="wp-mini-genres"></p>
              <p id="wp-mini-desc"></p>
              <a id="wp-mini-detail-link" href="#" class="wp-mini-link">
                Xem thông tin phim <i class="fa-solid fa-arrow-right"></i>
              </a>
            </div>
          </div>
        </div>

        <!-- ================= SIDEBAR ================= -->
        <div class="fd-sidebar">
          <h3>Có Thể Bạn Thích</h3>
          <div id="fd-suggestions"></div>
        </div>
      </div>
    </div>

    <!-- Nạp script.js (không cần Episodes.js nữa - link m3u8 lấy từ MySQL) -->
    <script src="script.js"></script>

    <!-- Đoạn script xử lý đọc URL, lấy dữ liệu phim từ API, phát video -->
    <script>
      (async () => {
        const params = new URLSearchParams(window.location.search);
        const movieTitle = params.get("title");
        let episodeNum = parseInt(params.get("ep")) || 1;
        const slug = params.get("slug") || "";
        const posterFromUrl = params.get("poster") || "";
        const episodesFromUrl = parseInt(params.get("episodes")) || 20;

        if (!movieTitle) {
          document.getElementById("watch-movie-title").innerText =
            "Không tìm thấy thông tin phim!";
        }

        // Lấy dữ liệu chuẩn của phim (kèm link m3u8 thật) trực tiếp từ MySQL
        const movieObj = await fetchMovieBySlug(slug);
        if (movieObj) addToGlobalMoviesList([movieObj]);

        const realTitle = movieObj ? movieObj.title : movieTitle || "Phim";
        const realPoster = movieObj ? movieObj.poster : posterFromUrl;
        const realSlug = movieObj ? movieObj.slug : slug;
        const totalEp = movieObj ? movieObj.episodes : episodesFromUrl;

        document.getElementById("page-title").innerText =
          `${realTitle} - Tập ${episodeNum}`;
        document.getElementById("watch-movie-title").innerText = realTitle;
        document.getElementById("current-ep-title").innerText =
          `Tập ${episodeNum}`;

        // Breadcrumb
        function renderWatchBreadcrumb() {
          const bc = document.getElementById("fd-breadcrumb");
          if (!bc) return;
          const safe = typeof escapeHtml === "function" ? escapeHtml : (s) => s;
          let html = `<a href="index.html">Trang chủ</a>`;
          if (movieObj) {
            const detailParams = new URLSearchParams({
              title: movieObj.title,
              slug: movieObj.slug,
              poster: movieObj.poster,
              desc: movieObj.desc || "",
              episodes: totalEp,
            });
            html += `<span class="sep">/</span><a href="detail.html?${detailParams.toString()}">${safe(realTitle)}</a>`;
          } else {
            html += `<span class="sep">/</span><span>${safe(realTitle)}</span>`;
          }
          html += `<span class="sep">/</span><span class="current">Tập ${episodeNum}</span>`;
          bc.innerHTML = html;
        }
        renderWatchBreadcrumb();

        // Điều hướng tập trước / sau
        function goToEpisode(ep) {
          if (ep < 1 || ep > totalEp) return;
          const navParams = new URLSearchParams({
            title: realTitle,
            ep,
            slug: realSlug,
            poster: realPoster,
            episodes: totalEp,
          });
          window.location.href = `watch.html?${navParams.toString()}`;
        }

        const prevBtn = document.getElementById("wp-prev-btn");
        const nextBtn = document.getElementById("wp-next-btn");
        prevBtn.disabled = episodeNum <= 1;
        nextBtn.disabled = episodeNum >= totalEp;
        prevBtn.onclick = () => goToEpisode(episodeNum - 1);
        nextBtn.onclick = () => goToEpisode(episodeNum + 1);

        // Render danh sách tập phim ở dưới video (kèm tìm kiếm)
        const grid = document.getElementById("watch-episode-grid");

        function renderEpisodeGrid(filterText = "") {
          grid.innerHTML = "";
          const keyword = filterText.trim();
          for (let i = 1; i <= totalEp; i++) {
            if (keyword && !String(i).includes(keyword)) continue;
            const btn = document.createElement("button");
            btn.className = `ep-btn ${i === episodeNum ? "active" : ""}`;
            btn.innerText = `Tập ${i}`;
            btn.onclick = () => goToEpisode(i);
            grid.appendChild(btn);
          }
        }
        renderEpisodeGrid();

        document
          .getElementById("wp-ep-search-input")
          .addEventListener("input", (e) => renderEpisodeGrid(e.target.value));

        // Khối mini info phim
        document.getElementById("wp-mini-poster").src = realPoster;
        document.getElementById("wp-mini-poster").onerror = function () {
          this.src = "https://placehold.co/180x260";
        };
        document.getElementById("wp-mini-title").innerText = realTitle;
        document.getElementById("wp-mini-genres").innerText = movieObj
          ? movieObj.genres || ""
          : "";
        document.getElementById("wp-mini-desc").innerText = movieObj
          ? movieObj.desc || ""
          : "";
        const miniDetailParams = new URLSearchParams({
          title: realTitle,
          slug: realSlug,
          poster: realPoster,
          desc: movieObj ? movieObj.desc || "" : "",
          episodes: totalEp,
        });
        document.getElementById("wp-mini-detail-link").href =
          `detail.html?${miniDetailParams.toString()}`;

        // Phần phim (season switch) - fetch riêng theo movie_group từ API
        if (
          movieObj &&
          movieObj.group &&
          typeof renderMovieParts === "function"
        ) {
          const parts = await fetchMovies({ group: movieObj.group, limit: 10 });
          addToGlobalMoviesList(parts);
          renderMovieParts(movieObj.slug, movieObj.group);
        }

        // Gợi ý liên quan - fetch riêng theo thể loại đầu tiên từ API
        if (
          movieObj &&
          movieObj.genres &&
          typeof renderRelatedSuggestions === "function"
        ) {
          const firstGenre = movieObj.genres.split(",")[0].trim();
          const related = await fetchMovies({ genre: firstGenre, limit: 12 });
          addToGlobalMoviesList(related);
          renderRelatedSuggestions(realSlug, movieObj.genres);
        }

        // Lấy link m3u8 thật từ MySQL (movieObj.episodeUrls), khởi tạo player
        let videoSrc =
          movieObj && movieObj.episodeUrls
            ? movieObj.episodeUrls[episodeNum - 1] || ""
            : "";

        // Fallback nếu phim chưa có link m3u8 thật trong DB
        if (!videoSrc) {
          videoSrc = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";
        }

        // Khởi tạo phát video với HLS.js và Plyr
        const video = document.getElementById("video-player");
        if (typeof Hls !== "undefined" && Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(videoSrc);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video
              .play()
              .catch((err) => console.log("Tự động phát bị chặn:", err));
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = videoSrc;
          video.addEventListener("loadedmetadata", () => {
            video
              .play()
              .catch((err) => console.log("Tự động phát bị chặn:", err));
          });
        }

        const player = new Plyr(video, {
          controls: [
            "play-large",
            "play",
            "rewind",
            "fast-forward",
            "progress",
            "current-time",
            "duration",
            "mute",
            "volume",
            "settings",
            "pip",
            "fullscreen",
          ],
          settings: ["speed"],
          seekTime: 10,
          tooltips: { controls: true, seek: true },
        });

        // Bổ sung xử lý sự kiện nút Fullscreen cho thiết bị iOS Safari di động
        player.on("enterfullscreen", () => {
          if (video.webkitEnterFullscreen && !document.fullscreenElement) {
            video.webkitEnterFullscreen();
          }
        });

        // Tự động chuyển tập kế tiếp khi xem xong (nếu bật)
        video.addEventListener("ended", () => {
          const autoNextOn =
            document.getElementById("wp-autonext-toggle").checked;
          if (autoNextOn && episodeNum < totalEp) {
            goToEpisode(episodeNum + 1);
          }
        });
      })();
    </script>
  </body>
</html>
