<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Xem Phim - LauPhim</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Plyr CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"
    />

    <!-- Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Plyr JS -->
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

    <!-- Sửa lỗi video bị lệch lên trên khi bật toàn màn hình -->
    <style>
      .plyr--fullscreen-active,
      .plyr:fullscreen {
        background: #000 !important;
        width: 100% !important;
        height: 100% !important;
        max-height: none !important;
        aspect-ratio: auto !important;
      }

      .plyr--fullscreen-active .plyr__video-wrapper,
      .plyr:fullscreen .plyr__video-wrapper {
        width: 100% !important;
        height: 100% !important;
        max-height: none !important;
        aspect-ratio: auto !important;
        padding-bottom: 0 !important;
      }

      .plyr--fullscreen-active video,
      .plyr:fullscreen video {
        width: 100% !important;
        height: 100% !important;
        max-height: none !important;
        aspect-ratio: auto !important;
        object-fit: contain !important;
      }

      /* Style cho danh sách Server chọn nguồn phim */
      .server-tabs {
        display: flex;
        gap: 8px;
        margin: 12px 0 16px 0;
        flex-wrap: wrap;
        align-items: center;
      }

      .server-btn {
        background: #222;
        color: #fff;
        border: 1px solid #444;
        padding: 6px 14px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s ease;
      }

      .server-btn:hover {
        background: #333;
        border-color: #666;
      }

      .server-btn.active {
        background: #e50914;
        border-color: #e50914;
        color: #fff;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div class="fd-wrap">
      <!-- Breadcrumb -->
      <div class="fd-breadcrumb" id="fd-breadcrumb">
        <a href="index.html">Trang chủ</a>
      </div>

      <div class="fd-layout">
        <!-- ================= MAIN ================= -->
        <div class="fd-main">
          <!-- Player -->
          <div class="wp-player-card">
            <div class="video-wrapper" id="video-wrapper-box">
              <video id="video-player" controls playsinline></video>
            </div>

            <div class="wp-player-toolbar">
              <div class="wp-now-playing">
                <h1 id="watch-movie-title">Đang tải tên phim...</h1>

                <p id="current-ep-title">Tập 1</p>
              </div>

              <div class="wp-nav-btns">
                <button id="wp-prev-btn" class="wp-nav-btn">
                  <i class="fa-solid fa-backward-step"></i>
                  Tập trước
                </button>

                <label class="wp-autonext">
                  <input type="checkbox" id="wp-autonext-toggle" />
                  Tự động chuyển tập
                </label>

                <button id="wp-next-btn" class="wp-nav-btn">
                  Tập sau
                  <i class="fa-solid fa-forward-step"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Phần phim -->
          <div id="parts-section" style="display: none; margin-bottom: 20px">
            <h3
              style="
                border-bottom: 2px solid #e50914;
                display: inline-block;
                padding-bottom: 5px;
                margin-bottom: 12px;
              "
            >
              Phần Phim
            </h3>

            <div
              id="detail-parts-grid"
              style="display: flex; flex-wrap: wrap; gap: 10px"
            ></div>
          </div>

          <!-- Danh sách tập -->
          <div class="episodes-section">
            <div class="wp-ep-header">
              <h3 style="margin: 0">Danh Sách Tập</h3>

              <div class="wp-ep-search">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                  type="text"
                  id="wp-ep-search-input"
                  placeholder="Tìm tập..."
                />
              </div>
            </div>

            <!-- CHỌN SERVER / NGUỒN PHIM (Vietsub, Thuyết Minh, Lồng Tiếng) -->
            <div class="server-tabs" id="server-tabs-container">
              <span style="color: #aaa; font-size: 13px"
                >Đang tải nguồn phim...</span
              >
            </div>

            <div class="wp-episode-scroll">
              <div id="watch-episode-grid" class="episode-grid"></div>
            </div>
          </div>

          <!-- Mini info phim -->
          <div class="wp-movie-mini">
            <img id="wp-mini-poster" src="" alt="Poster" />

            <div class="wp-mini-info">
              <h4 id="wp-mini-title"></h4>

              <p class="wp-mini-genres" id="wp-mini-genres"></p>

              <p id="wp-mini-desc"></p>

              <a id="wp-mini-detail-link" href="#" class="wp-mini-link">
                Xem thông tin phim
                <i class="fa-solid fa-arrow-right"></i>
              </a>
            </div>
          </div>
        </div>

        <!-- ================= SIDEBAR ================= -->
        <div class="fd-sidebar">
          <h3>Có Thể Bạn Thích</h3>

          <div id="fd-suggestions"></div>
        </div>
      </div>
    </div>

    <!-- Thứ tự nạp giống index.html -->
    <script src="./Episodes.js"></script>
    <script src="./data.js?v=3"></script>
    <script src="./api.js?v=3"></script>
    <script src="./utils.js?v=3"></script>
    <script src="./wishlist.js?v=3"></script>
    <script src="./render.js?v=3"></script>
    <script src="./search.js?v=3"></script>
    <script src="./tmdb.js?v=3"></script>
    <script src="./tv-nav.js?v=3"></script>

    <!-- ================= WATCH SCRIPT ================= -->
    <script>
      (async () => {
        const params = new URLSearchParams(window.location.search);

        const movieTitle = params.get("title");

        let episodeNum = parseInt(params.get("ep")) || 1;

        const slug = params.get("slug") || "";

        const posterFromUrl = params.get("poster") || "";

        const episodesFromUrl = parseInt(params.get("episodes")) || 20;

        if (!movieTitle) {
          document.getElementById("watch-movie-title").innerText =
            "Không tìm thấy thông tin phim!";
        }

        // =========================
        // LẤY THÔNG TIN PHIM
        // =========================

        const movieObj = await fetchMovieBySlug(slug);

        if (movieObj) {
          addToGlobalMoviesList([movieObj]);
        }

        const realTitle = movieObj ? movieObj.title : movieTitle || "Phim";

        const realPoster = movieObj ? movieObj.poster : posterFromUrl;

        const realSlug = movieObj ? movieObj.slug : slug;

        let totalEp = movieObj ? movieObj.episodes : episodesFromUrl;

        document.getElementById("page-title").innerText =
          `${realTitle} - Tập ${episodeNum}`;

        document.getElementById("watch-movie-title").innerText = realTitle;

        document.getElementById("current-ep-title").innerText =
          `Tập ${episodeNum}`;

        // =========================
        // BREADCRUMB
        // =========================

        function renderWatchBreadcrumb() {
          const bc = document.getElementById("fd-breadcrumb");

          if (!bc) return;

          const safe = typeof escapeHtml === "function" ? escapeHtml : (s) => s;

          let html = `<a href="index.html">Trang chủ</a>`;

          if (movieObj) {
            const detailParams = new URLSearchParams({
              title: movieObj.title,
              slug: movieObj.slug,
              poster: movieObj.poster,
              desc: movieObj.desc || "",
              episodes: totalEp,
            });

            html +=
              `<span class="sep">/</span>` +
              `<a href="detail.html?${detailParams.toString()}">` +
              `${safe(realTitle)}` +
              `</a>`;
          } else {
            html +=
              `<span class="sep">/</span>` + `<span>${safe(realTitle)}</span>`;
          }

          html +=
            `<span class="sep">/</span>` +
            `<span class="current">Tập ${episodeNum}</span>`;

          bc.innerHTML = html;
        }

        renderWatchBreadcrumb();

        // =========================
        // LẤY DANH SÁCH SERVER & TẬP TỪ API (phimapi.com)
        // =========================
        let allServers = [];
        let currentServerIndex = 0;

        try {
          if (realSlug) {
            const res = await fetch(
              `https://phimapi.com/phim/${encodeURIComponent(realSlug)}`,
            );
            if (res.ok) {
              const apiData = await res.json();
              allServers = apiData.episodes || [];
            }
          }
        } catch (error) {
          console.warn(
            "Lỗi khi fetch danh sách Server từ API phimapi.com:",
            error,
          );
        }

        function getCurrentServerEpisodes() {
          if (allServers.length > 0 && allServers[currentServerIndex]) {
            return allServers[currentServerIndex].server_data || [];
          }
          return [];
        }

        // =========================
        // RENDER DANH SÁCH SERVER (Vietsub, Thuyết Minh, Lồng Tiếng)
        // =========================
        const serverTabsContainer = document.getElementById(
          "server-tabs-container",
        );

        function renderServerTabs() {
          if (!serverTabsContainer) return;
          serverTabsContainer.innerHTML = "";

          if (allServers.length === 0) {
            serverTabsContainer.innerHTML =
              '<span style="color:#aaa;font-size:13px;">Nguồn phát chuẩn</span>';
            return;
          }

          const label = document.createElement("span");
          label.style.cssText =
            "color:#bbb; font-size:13px; font-weight:600; margin-right:4px;";
          label.innerText = "Nguồn Phim:";
          serverTabsContainer.appendChild(label);

          allServers.forEach((server, index) => {
            const btn = document.createElement("button");
            btn.className = `server-btn ${index === currentServerIndex ? "active" : ""}`;
            btn.innerText = server.server_name;

            btn.onclick = () => {
              currentServerIndex = index;
              renderServerTabs();

              const currentEpList = getCurrentServerEpisodes();
              if (currentEpList.length > 0) {
                totalEp = currentEpList.length;
              }

              renderEpisodeGrid();
              loadAndPlayCurrentEpisode();
            };

            serverTabsContainer.appendChild(btn);
          });
        }

        renderServerTabs();

        // =========================
        // ĐIỀU HƯỚNG TẬP
        // =========================

        function goToEpisode(ep) {
          if (ep < 1 || ep > totalEp) {
            return;
          }

          // Lưu lịch sử trước khi chuyển tập
          saveWatchHistory();

          episodeNum = ep;
          document.getElementById("page-title").innerText =
            `${realTitle} - Tập ${episodeNum}`;
          document.getElementById("current-ep-title").innerText =
            `Tập ${episodeNum}`;

          renderWatchBreadcrumb();
          updateNavButtons();
          renderEpisodeGrid();
          loadAndPlayCurrentEpisode();
        }

        const prevBtn = document.getElementById("wp-prev-btn");
        const nextBtn = document.getElementById("wp-next-btn");

        function updateNavButtons() {
          if (prevBtn) prevBtn.disabled = episodeNum <= 1;
          if (nextBtn) nextBtn.disabled = episodeNum >= totalEp;
        }

        updateNavButtons();

        if (prevBtn) prevBtn.onclick = () => goToEpisode(episodeNum - 1);
        if (nextBtn) nextBtn.onclick = () => goToEpisode(episodeNum + 1);

        // =========================
        // DANH SÁCH TẬP
        // =========================

        const grid = document.getElementById("watch-episode-grid");

        function renderEpisodeGrid(filterText = "") {
          if (!grid) return;
          grid.innerHTML = "";

          const keyword = filterText.trim().toLowerCase();
          const serverEpisodes = getCurrentServerEpisodes();

          if (serverEpisodes.length > 0) {
            totalEp = serverEpisodes.length;
            updateNavButtons();

            serverEpisodes.forEach((epObj, idx) => {
              const epName = epObj.name || `Tập ${idx + 1}`;
              if (keyword && !epName.toLowerCase().includes(keyword)) {
                return;
              }

              const btn = document.createElement("button");
              btn.className = `ep-btn ${idx + 1 === episodeNum ? "active" : ""}`;
              btn.innerText = epName;
              btn.onclick = () => goToEpisode(idx + 1);
              grid.appendChild(btn);
            });
          } else {
            for (let i = 1; i <= totalEp; i++) {
              if (keyword && !String(i).includes(keyword)) {
                continue;
              }

              const btn = document.createElement("button");
              btn.className = `ep-btn ${i === episodeNum ? "active" : ""}`;
              btn.innerText = `Tập ${i}`;
              btn.onclick = () => goToEpisode(i);
              grid.appendChild(btn);
            }
          }
        }

        renderEpisodeGrid();

        const epSearchInput = document.getElementById("wp-ep-search-input");
        if (epSearchInput) {
          epSearchInput.addEventListener("input", (e) =>
            renderEpisodeGrid(e.target.value),
          );
        }

        // =========================
        // MINI INFO
        // =========================

        const miniPoster = document.getElementById("wp-mini-poster");

        const miniTitle = document.getElementById("wp-mini-title");

        const miniGenres = document.getElementById("wp-mini-genres");

        const miniDesc = document.getElementById("wp-mini-desc");

        const miniDetail = document.getElementById("wp-mini-detail-link");

        if (movieObj) {
          if (miniPoster) miniPoster.src = movieObj.poster || "";

          if (miniTitle) miniTitle.innerText = movieObj.title || "";

          if (miniGenres) miniGenres.innerText = movieObj.genres || "";

          if (miniDesc) miniDesc.innerText = movieObj.desc || "";

          const detailParams = new URLSearchParams({
            title: movieObj.title,
            slug: movieObj.slug,
            poster: movieObj.poster,
            desc: movieObj.desc || "",
            episodes: totalEp,
          });

          if (miniDetail)
            miniDetail.href = `detail.html?${detailParams.toString()}`;
        } else {
          if (miniPoster) miniPoster.src = realPoster || "";

          if (miniTitle) miniTitle.innerText = realTitle;

          if (miniGenres) miniGenres.innerText = "";

          if (miniDesc) miniDesc.innerText = "";

          if (miniDetail) miniDetail.href = "#";
        }

        // =========================
        // RENDER PHẦN PHIM
        // =========================

        if (
          movieObj &&
          movieObj.group &&
          typeof renderMovieParts === "function"
        ) {
          try {
            const parts = await fetchMovies({
              group: movieObj.group,
              limit: 10,
            });
            addToGlobalMoviesList(parts);
            renderMovieParts(movieObj.slug, movieObj.group);
          } catch (error) {
            console.warn("Không render được phần phim:", error);
          }
        }

        // =========================
        // RELATED SUGGESTIONS
        // =========================

        if (
          movieObj &&
          movieObj.genres &&
          typeof renderRelatedSuggestions === "function"
        ) {
          try {
            const firstGenre = movieObj.genres.split(",")[0].trim();
            const related = await fetchMovies({ genre: firstGenre, limit: 12 });
            addToGlobalMoviesList(related);
            renderRelatedSuggestions(movieObj.slug, movieObj.genres);
          } catch (error) {
            console.warn("Không render được phim đề xuất:", error);
          }
        }

        // =========================
        // VIDEO
        // =========================

        const video = document.getElementById("video-player");

        if (!video) {
          console.error("Không tìm thấy video-player");
          return;
        }

        let hls = null;
        let player = null;

        if (typeof Plyr !== "undefined") {
          player = new Plyr(video, {
            controls: [
              "play-large",
              "rewind",
              "play",
              "fast-forward",
              "progress",
              "current-time",
              "duration",
              "mute",
              "volume",
              "settings",
              "pip",
              "fullscreen",
            ],
            settings: ["quality", "speed"],
            seekTime: 10,
            keyboard: { focused: false, global: false },
            autoplay: false,
          });
        }

        async function getActiveVideoSrc() {
          const serverEpisodes = getCurrentServerEpisodes();
          if (serverEpisodes.length > 0) {
            const epObj = serverEpisodes[episodeNum - 1] || serverEpisodes[0];
            if (epObj) {
              return epObj.link_m3u8 || epObj.link_embed || "";
            }
          }

          if (movieObj && Array.isArray(movieObj.episodeUrls)) {
            const url = movieObj.episodeUrls[episodeNum - 1];
            if (url) return url;
          }

          try {
            const url = await fetchEpisodeUrlFromKKPhim(realSlug, episodeNum);
            if (url) return url;
          } catch (error) {}

          try {
            if (window.allEpisodesData && window.allEpisodesData[realSlug]) {
              const fallback = window.allEpisodesData[realSlug];
              const item = Array.isArray(fallback)
                ? fallback[episodeNum - 1]
                : fallback[episodeNum];

              if (item) return typeof item === "string" ? item : item.url;
            }
          } catch (error) {}

          return "";
        }

        async function loadAndPlayCurrentEpisode() {
          const videoSrc = await getActiveVideoSrc();

          if (!videoSrc) {
            console.error("Không tìm thấy link video!");

            const wrap = document.getElementById("video-wrapper-box");
            if (wrap) {
              const existingMsg = wrap.querySelector(".no-link-msg");
              if (!existingMsg) {
                wrap.insertAdjacentHTML(
                  "beforeend",
                  '<p class="no-link-msg" style="color:#bbb;text-align:center;padding:30px;">Chưa có link phát cho tập này.</p>',
                );
              }
            }
            return;
          }

          const wrap = document.getElementById("video-wrapper-box");
          if (wrap) {
            const existingMsg = wrap.querySelector(".no-link-msg");
            if (existingMsg) existingMsg.remove();
          }

          console.log("🎬 Video source:", videoSrc);

          if (typeof Hls !== "undefined" && Hls.isSupported()) {
            if (!hls) hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
          } else {
            video.src = videoSrc;
          }

          hasRestoredPosition = false;
          video.play().catch(() => {});
        }

        await loadAndPlayCurrentEpisode();

        // =========================
        // WATCH HISTORY
        // =========================

        const WATCH_HISTORY_KEY = "continue_watching_list";
        const EP_POSITIONS_KEY = "episode_positions";

        function getEpisodePositions() {
          try {
            const raw = localStorage.getItem(EP_POSITIONS_KEY);
            const parsed = raw ? JSON.parse(raw) : {};
            return parsed && typeof parsed === "object" ? parsed : {};
          } catch (e) {
            return {};
          }
        }

        function movieKey() {
          return String(realSlug || realTitle || "");
        }

        let hasRestoredPosition = false;
        let lastHistorySave = 0;

        function getWatchHistory() {
          try {
            const raw = localStorage.getItem(WATCH_HISTORY_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : [];
          } catch (error) {
            return [];
          }
        }

        function saveWatchHistory() {
          try {
            if (!video || !isFinite(video.duration) || video.duration <= 0) {
              return;
            }

            const currentTime = Number(video.currentTime);
            const duration = Number(video.duration);

            if (!isFinite(currentTime) || currentTime < 1) {
              return;
            }

            const progress = Math.min(
              100,
              Math.max(0, Math.round((currentTime / duration) * 100)),
            );

            let history = getWatchHistory();
            const sameMovie = (item) =>
              realSlug
                ? String(item.slug || "") === String(realSlug)
                : item.title === realTitle;
            history = history.filter((item) => !sameMovie(item));

            const watchItem = {
              title: realTitle,
              slug: realSlug,
              poster: realPoster,
              desc: movieObj ? movieObj.desc || "" : "",
              episode: episodeNum,
              totalEpisodes: totalEp,
              progress,
              currentTime,
              duration,
              updatedAt: Date.now(),
            };

            history.unshift(watchItem);
            history = history.slice(0, 30);
            localStorage.setItem(WATCH_HISTORY_KEY, JSON.stringify(history));

            const positions = getEpisodePositions();
            const key = movieKey();
            positions[key] = positions[key] || {};
            positions[key][String(episodeNum)] = {
              currentTime,
              duration,
              progress,
              updatedAt: Date.now(),
            };
            localStorage.setItem(EP_POSITIONS_KEY, JSON.stringify(positions));
          } catch (error) {
            console.error("❌ Không lưu được lịch sử xem:", error);
          }
        }

        function restoreWatchPosition() {
          if (hasRestoredPosition) return;
          if (!video || !isFinite(video.duration) || video.duration <= 0)
            return;

          try {
            const positions = getEpisodePositions();
            let saved =
              positions[movieKey()] &&
              positions[movieKey()][String(episodeNum)];

            if (!saved) {
              saved = getWatchHistory().find(
                (item) =>
                  String(item.slug || item.title || "") === movieKey() &&
                  Number(item.episode) === Number(episodeNum),
              );
            }

            hasRestoredPosition = true;
            if (!saved) return;

            const savedTime = Number(saved.currentTime) || 0;
            if (savedTime > 5 && savedTime < video.duration - 10) {
              video.currentTime = Math.min(savedTime, video.duration - 10);
            }
          } catch (error) {
            hasRestoredPosition = true;
          }
        }

        video.addEventListener("loadedmetadata", restoreWatchPosition);
        video.addEventListener("durationchange", restoreWatchPosition);
        video.addEventListener("canplay", restoreWatchPosition);

        video.addEventListener("timeupdate", () => {
          const now = Date.now();
          if (now - lastHistorySave >= 5000) {
            lastHistorySave = now;
            saveWatchHistory();
          }
        });

        video.addEventListener("pause", saveWatchHistory);
        video.addEventListener("seeked", saveWatchHistory);

        // =========================
        // NÚT BỎ QUA INTRO
        // =========================
        const INTRO_TIMES = {};
        const DEFAULT_INTRO = { start: 0, end: 90 };

        function getIntroRange() {
          const cfg = INTRO_TIMES[realSlug];
          if (!cfg) return DEFAULT_INTRO;
          const epCfg = cfg.episodes && cfg.episodes[episodeNum];
          return epCfg || cfg;
        }

        (function setupSkipIntro() {
          const style = document.createElement("style");
          style.textContent = `
            .skip-intro-btn {
              position: absolute; right: 20px; bottom: 70px; z-index: 5;
              padding: 10px 18px; border: 1px solid rgba(255,255,255,.7);
              border-radius: 6px; background: rgba(0,0,0,.65); color: #fff;
              font-size: 15px; font-weight: 600; cursor: pointer; display: none;
            }
            .skip-intro-btn:hover { background: #fff; color: #000; }
            .skip-intro-btn.show { display: block; }
          `;
          document.head.appendChild(style);

          const btn = document.createElement("button");
          btn.className = "skip-intro-btn";
          btn.textContent = "Bỏ qua intro ⏭";

          const host = player ? player.elements.container : video.parentElement;
          host.appendChild(btn);

          btn.addEventListener("click", () => {
            video.currentTime = getIntroRange().end;
            btn.classList.remove("show");
          });

          video.addEventListener("timeupdate", () => {
            const { start, end } = getIntroRange();
            const t = video.currentTime;
            btn.classList.toggle("show", t >= start && t < end - 1);
          });
        })();

        // =========================
        // CÔNG CỤ ĐO INTRO
        // =========================
        if (new URLSearchParams(location.search).get("introtool") === "1") {
          const panel = document.createElement("div");
          panel.style.cssText =
            "position:absolute;top:10px;right:10px;z-index:9;background:rgba(0,0,0,.8);" +
            "color:#fff;padding:10px;border-radius:8px;font-size:13px;width:290px;";
          panel.innerHTML = `
            <div>Hiện tại: <b id="it-now">0</b>s</div>
            <div style="margin:6px 0;display:flex;gap:6px">
              <button id="it-start" style="flex:1;cursor:pointer">Đặt START</button>
              <button id="it-end" style="flex:1;cursor:pointer">Đặt END</button>
            </div>
            <input id="it-out" readonly style="width:100%;box-sizing:border-box;font-size:12px" />
          `;
          (player
            ? player.elements.container
            : video.parentElement
          ).appendChild(panel);

          let itStart = 0;
          let itEnd = 0;
          const out = panel.querySelector("#it-out");
          const refresh = () => {
            out.value = `"${realSlug}": { start: ${itStart}, end: ${itEnd} },`;
          };
          refresh();

          video.addEventListener("timeupdate", () => {
            panel.querySelector("#it-now").textContent = Math.floor(
              video.currentTime,
            );
          });
          panel.querySelector("#it-start").onclick = () => {
            itStart = Math.floor(video.currentTime);
            refresh();
          };
          panel.querySelector("#it-end").onclick = () => {
            itEnd = Math.ceil(video.currentTime);
            refresh();
          };
        }

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") {
            saveWatchHistory();
          }
        });

        window.addEventListener("beforeunload", saveWatchHistory);

        // =========================
        // AUTO NEXT
        // =========================
        const AUTONEXT_KEY = "autonext_enabled";
        const AUTONEXT_COUNT_KEY = "autonext_count";
        const MAX_AUTO_EPISODES = 3;

        const autoNextToggle = document.getElementById("wp-autonext-toggle");
        if (autoNextToggle) {
          autoNextToggle.checked = localStorage.getItem(AUTONEXT_KEY) === "1";
          autoNextToggle.addEventListener("change", () => {
            localStorage.setItem(
              AUTONEXT_KEY,
              autoNextToggle.checked ? "1" : "0",
            );
          });
        }

        const resetAutoCount = () =>
          sessionStorage.setItem(AUTONEXT_COUNT_KEY, "0");
        ["pointerdown", "keydown", "touchstart"].forEach((evt) =>
          window.addEventListener(evt, resetAutoCount, { passive: true }),
        );

        video.addEventListener("ended", () => {
          saveWatchHistory();
          if (
            !autoNextToggle ||
            !autoNextToggle.checked ||
            episodeNum >= totalEp
          )
            return;

          const count = Number(sessionStorage.getItem(AUTONEXT_COUNT_KEY) || 0);
          if (count >= MAX_AUTO_EPISODES) return;

          sessionStorage.setItem(AUTONEXT_COUNT_KEY, String(count + 1));
          goToEpisode(episodeNum + 1);
        });

        // =========================
        // PHÍM TẮT
        // =========================
        document.addEventListener("keydown", (e) => {
          const t = e.target;
          const TEXT_TYPES = [
            "text",
            "search",
            "email",
            "url",
            "tel",
            "password",
            "number",
          ];
          if (
            t &&
            (t.tagName === "TEXTAREA" ||
              t.tagName === "SELECT" ||
              t.isContentEditable ||
              (t.tagName === "INPUT" && TEXT_TYPES.includes(t.type)))
          ) {
            return;
          }
          if (e.ctrlKey || e.altKey || e.metaKey) return;

          const showToast = (text) => {
            let toast = document.getElementById("key-toast");
            if (!toast) {
              toast = document.createElement("div");
              toast.id = "key-toast";
              toast.style.cssText =
                "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);" +
                "background:rgba(0,0,0,.7);color:#fff;padding:10px 18px;border-radius:8px;" +
                "font-size:18px;font-weight:600;z-index:8;pointer-events:none;" +
                "opacity:0;transition:opacity .2s;";
              (player
                ? player.elements.container
                : video.parentElement
              ).appendChild(toast);
            }
            toast.textContent = text;
            toast.style.opacity = "1";
            clearTimeout(toast._t);
            toast._t = setTimeout(() => (toast.style.opacity = "0"), 700);
          };

          switch (e.key) {
            case "f":
            case "F":
              e.preventDefault();
              if (player) {
                player.fullscreen.toggle();
              } else if (document.fullscreenElement) {
                document.exitFullscreen();
              } else {
                video.requestFullscreen();
              }
              break;

            case "ArrowLeft":
              e.preventDefault();
              video.currentTime = Math.max(0, video.currentTime - 10);
              showToast("⏪ -10s");
              break;

            case "ArrowRight":
              e.preventDefault();
              video.currentTime = Math.min(
                video.duration || Infinity,
                video.currentTime + 10,
              );
              showToast("+10s ⏩");
              break;

            case "ArrowUp":
              e.preventDefault();
              video.muted = false;
              video.volume = Math.min(
                1,
                Math.round((video.volume + 0.1) * 10) / 10,
              );
              showToast("🔊 " + Math.round(video.volume * 100) + "%");
              break;

            case "ArrowDown":
              e.preventDefault();
              video.volume = Math.max(
                0,
                Math.round((video.volume - 0.1) * 10) / 10,
              );
              showToast(
                video.volume === 0
                  ? "🔇 0%"
                  : "🔉 " + Math.round(video.volume * 100) + "%",
              );
              break;

            case " ":
            case "k":
            case "K":
              e.preventDefault();
              if (video.paused) video.play().catch(() => {});
              else video.pause();
              break;

            case "m":
            case "M":
              video.muted = !video.muted;
              showToast(video.muted ? "🔇 Tắt tiếng" : "🔊 Bật tiếng");
              break;
          }
        });

        // =========================
        // TĂNG ÂM LƯỢNG VƯỢT 100% (Phím B)
        // =========================
        (function setupVolumeBoost() {
          if (!player) return;

          const BOOST_KEY = "audio_boost";
          const LEVELS = [1, 1.5, 2, 3];
          let level = Number(localStorage.getItem(BOOST_KEY)) || 1;
          if (!LEVELS.includes(level)) level = 1;

          let audioCtx = null;
          let gainNode = null;

          function ensureAudio() {
            if (audioCtx) return true;
            try {
              const AC = window.AudioContext || window.webkitAudioContext;
              audioCtx = new AC();
              const source = audioCtx.createMediaElementSource(video);
              gainNode = audioCtx.createGain();
              const comp = audioCtx.createDynamicsCompressor();
              source
                .connect(gainNode)
                .connect(comp)
                .connect(audioCtx.destination);
              return true;
            } catch (err) {
              return false;
            }
          }

          function applyBoost() {
            if (level > 1 || audioCtx) {
              if (!ensureAudio()) return;
              if (audioCtx.state === "suspended") audioCtx.resume();
              gainNode.gain.value = level;
            }
          }

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "plyr__control";
          btn.style.cssText = "font-weight:700;font-size:13px;min-width:40px;";

          function refreshBtn() {
            btn.textContent = "x" + level;
            btn.title = "Tăng âm lượng (phím B)";
          }

          function cycle() {
            level = LEVELS[(LEVELS.indexOf(level) + 1) % LEVELS.length];
            localStorage.setItem(BOOST_KEY, String(level));
            applyBoost();
            refreshBtn();
          }

          btn.addEventListener("click", cycle);
          refreshBtn();

          const volInput = player.elements.container.querySelector(
            'input[data-plyr="volume"]',
          );
          if (volInput) volInput.after(btn);
          else if (player.elements.controls)
            player.elements.controls.appendChild(btn);

          document.addEventListener("keydown", (e) => {
            const t = e.target;
            if (
              t &&
              (t.tagName === "TEXTAREA" ||
                t.tagName === "SELECT" ||
                t.isContentEditable ||
                (t.tagName === "INPUT" &&
                  [
                    "text",
                    "search",
                    "email",
                    "url",
                    "tel",
                    "password",
                    "number",
                  ].includes(t.type)))
            )
              return;
            if (e.ctrlKey || e.altKey || e.metaKey) return;
            if (e.key === "b" || e.key === "B") cycle();
          });
        })();
      })();
    </script>
  </body>
</html>
