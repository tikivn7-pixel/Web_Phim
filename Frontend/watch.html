<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">Xem Phim - Netfilm</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Plyr CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css"
    />

    <!-- Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Plyr JS -->
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>

    <!-- Sửa lỗi video bị lệch lên trên khi bật toàn màn hình -->
    <style>
      .plyr--fullscreen-active,
      .plyr:fullscreen {
        background: #000 !important;
        width: 100% !important;
        height: 100% !important;
        max-height: none !important;
        aspect-ratio: auto !important;
      }

      .plyr--fullscreen-active .plyr__video-wrapper,
      .plyr:fullscreen .plyr__video-wrapper {
        width: 100% !important;
        height: 100% !important;
        max-height: none !important;
        aspect-ratio: auto !important;
        padding-bottom: 0 !important;
      }

      .plyr--fullscreen-active video,
      .plyr:fullscreen video {
        width: 100% !important;
        height: 100% !important;
        max-height: none !important;
        aspect-ratio: auto !important;
        object-fit: contain !important;
      }
    </style>
  </head>

  <body>
    <div class="fd-wrap">
      <!-- Breadcrumb -->
      <div class="fd-breadcrumb" id="fd-breadcrumb">
        <a href="index.html">Trang chủ</a>
      </div>

      <div class="fd-layout">
        <!-- ================= MAIN ================= -->
        <div class="fd-main">
          <!-- Player -->
          <div class="wp-player-card">
            <div class="video-wrapper" id="video-wrapper-box">
              <video id="video-player" controls playsinline></video>
            </div>

            <div class="wp-player-toolbar">
              <div class="wp-now-playing">
                <h1 id="watch-movie-title">Đang tải tên phim...</h1>

                <p id="current-ep-title">Tập 1</p>
              </div>

              <div class="wp-nav-btns">
                <button id="wp-prev-btn" class="wp-nav-btn">
                  <i class="fa-solid fa-backward-step"></i>
                  Tập trước
                </button>

                <label class="wp-autonext">
                  <input type="checkbox" id="wp-autonext-toggle" />
                  Tự động chuyển tập
                </label>

                <button id="wp-next-btn" class="wp-nav-btn">
                  Tập sau
                  <i class="fa-solid fa-forward-step"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Phần phim -->
          <div id="parts-section" style="display: none; margin-bottom: 20px">
            <h3
              style="
                border-bottom: 2px solid #e50914;
                display: inline-block;
                padding-bottom: 5px;
                margin-bottom: 12px;
              "
            >
              Phần Phim
            </h3>

            <div
              id="detail-parts-grid"
              style="display: flex; flex-wrap: wrap; gap: 10px"
            ></div>
          </div>

          <!-- Danh sách tập -->
          <div class="episodes-section">
            <div class="wp-ep-header">
              <h3 style="margin: 0">Danh Sách Tập</h3>

              <div class="wp-ep-search">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                  type="text"
                  id="wp-ep-search-input"
                  placeholder="Tìm tập..."
                />
              </div>
            </div>

            <div class="wp-episode-scroll">
              <div id="watch-episode-grid" class="episode-grid"></div>
            </div>
          </div>

          <!-- Mini info phim -->
          <div class="wp-movie-mini">
            <img id="wp-mini-poster" src="" alt="Poster" />

            <div class="wp-mini-info">
              <h4 id="wp-mini-title"></h4>

              <p class="wp-mini-genres" id="wp-mini-genres"></p>

              <p id="wp-mini-desc"></p>

              <a id="wp-mini-detail-link" href="#" class="wp-mini-link">
                Xem thông tin phim
                <i class="fa-solid fa-arrow-right"></i>
              </a>
            </div>
          </div>
        </div>

        <!-- ================= SIDEBAR ================= -->
        <div class="fd-sidebar">
          <h3>Có Thể Bạn Thích</h3>

          <div id="fd-suggestions"></div>
        </div>
      </div>
    </div>

    <!-- Episodes.js -->
    <script src="Episodes.js"></script>

    <!-- Main script -->
    <script src="script.js"></script>

    <!-- ================= WATCH SCRIPT ================= -->
    <script>
      (async () => {
        const params = new URLSearchParams(window.location.search);

        const movieTitle = params.get("title");

        let episodeNum = parseInt(params.get("ep")) || 1;

        const slug = params.get("slug") || "";

        const posterFromUrl = params.get("poster") || "";

        const episodesFromUrl = parseInt(params.get("episodes")) || 20;

        if (!movieTitle) {
          document.getElementById("watch-movie-title").innerText =
            "Không tìm thấy thông tin phim!";
        }

        // =========================
        // LẤY THÔNG TIN PHIM
        // =========================

        const movieObj = await fetchMovieBySlug(slug);

        if (movieObj) {
          addToGlobalMoviesList([movieObj]);
        }

        const realTitle = movieObj ? movieObj.title : movieTitle || "Phim";

        const realPoster = movieObj ? movieObj.poster : posterFromUrl;

        const realSlug = movieObj ? movieObj.slug : slug;

        const totalEp = movieObj ? movieObj.episodes : episodesFromUrl;

        document.getElementById("page-title").innerText =
          `${realTitle} - Tập ${episodeNum}`;

        document.getElementById("watch-movie-title").innerText = realTitle;

        document.getElementById("current-ep-title").innerText =
          `Tập ${episodeNum}`;

        // =========================
        // BREADCRUMB
        // =========================

        function renderWatchBreadcrumb() {
          const bc = document.getElementById("fd-breadcrumb");

          if (!bc) return;

          const safe = typeof escapeHtml === "function" ? escapeHtml : (s) => s;

          let html = `<a href="index.html">Trang chủ</a>`;

          if (movieObj) {
            const detailParams = new URLSearchParams({
              title: movieObj.title,
              slug: movieObj.slug,
              poster: movieObj.poster,
              desc: movieObj.desc || "",
              episodes: totalEp,
            });

            html +=
              `<span class="sep">/</span>` +
              `<a href="detail.html?${detailParams.toString()}">` +
              `${safe(realTitle)}` +
              `</a>`;
          } else {
            html +=
              `<span class="sep">/</span>` + `<span>${safe(realTitle)}</span>`;
          }

          html +=
            `<span class="sep">/</span>` +
            `<span class="current">Tập ${episodeNum}</span>`;

          bc.innerHTML = html;
        }

        renderWatchBreadcrumb();

        // =========================
        // ĐIỀU HƯỚNG TẬP
        // =========================

        function goToEpisode(ep) {
          if (ep < 1 || ep > totalEp) {
            return;
          }

          // Lưu lịch sử trước khi chuyển tập
          saveWatchHistory();

          const navParams = new URLSearchParams({
            title: realTitle,
            ep,
            slug: realSlug,
            poster: realPoster,
            episodes: totalEp,
          });

          window.location.href = `watch.html?${navParams.toString()}`;
        }

        const prevBtn = document.getElementById("wp-prev-btn");

        const nextBtn = document.getElementById("wp-next-btn");

        prevBtn.disabled = episodeNum <= 1;

        nextBtn.disabled = episodeNum >= totalEp;

        prevBtn.onclick = () => goToEpisode(episodeNum - 1);

        nextBtn.onclick = () => goToEpisode(episodeNum + 1);

        // =========================
        // DANH SÁCH TẬP
        // =========================

        const grid = document.getElementById("watch-episode-grid");

        function renderEpisodeGrid(filterText = "") {
          grid.innerHTML = "";

          const keyword = filterText.trim();

          for (let i = 1; i <= totalEp; i++) {
            if (keyword && !String(i).includes(keyword)) {
              continue;
            }

            const btn = document.createElement("button");

            btn.className = `ep-btn ${i === episodeNum ? "active" : ""}`;

            btn.innerText = `Tập ${i}`;

            btn.onclick = () => goToEpisode(i);

            grid.appendChild(btn);
          }
        }

        renderEpisodeGrid();

        document
          .getElementById("wp-ep-search-input")
          .addEventListener("input", (e) => renderEpisodeGrid(e.target.value));

        // =========================
        // MINI INFO
        // =========================

        const miniPoster = document.getElementById("wp-mini-poster");

        const miniTitle = document.getElementById("wp-mini-title");

        const miniGenres = document.getElementById("wp-mini-genres");

        const miniDesc = document.getElementById("wp-mini-desc");

        const miniDetail = document.getElementById("wp-mini-detail-link");

        if (movieObj) {
          miniPoster.src = movieObj.poster || "";

          miniTitle.innerText = movieObj.title || "";

          miniGenres.innerText = movieObj.genres || "";

          miniDesc.innerText = movieObj.desc || "";

          const detailParams = new URLSearchParams({
            title: movieObj.title,
            slug: movieObj.slug,
            poster: movieObj.poster,
            desc: movieObj.desc || "",
            episodes: totalEp,
          });

          miniDetail.href = `detail.html?${detailParams.toString()}`;
        } else {
          miniPoster.src = realPoster || "";

          miniTitle.innerText = realTitle;

          miniGenres.innerText = "";

          miniDesc.innerText = "";

          miniDetail.href = "#";
        }

        // =========================
        // RENDER PHẦN PHIM
        // =========================

        if (typeof renderMovieParts === "function") {
          try {
            renderMovieParts(movieObj, realTitle);
          } catch (error) {
            console.warn("Không render được phần phim:", error);
          }
        }

        // =========================
        // RELATED SUGGESTIONS
        // =========================

        if (typeof renderRelatedSuggestions === "function") {
          try {
            renderRelatedSuggestions(movieObj);
          } catch (error) {
            console.warn("Không render được phim đề xuất:", error);
          }
        }

        // =========================
        // VIDEO
        // =========================

        const video = document.getElementById("video-player");

        if (!video) {
          console.error("Không tìm thấy video-player");

          return;
        }

        let videoSrc = "";

        try {
          if (movieObj && movieObj.episodesData) {
            const episodeData = movieObj.episodesData[episodeNum];

            if (episodeData && typeof episodeData === "string") {
              videoSrc = episodeData;
            } else if (episodeData && episodeData.url) {
              videoSrc = episodeData.url;
            }
          }
        } catch (error) {
          console.warn("Lỗi đọc episodesData:", error);
        }

        // =========================
        // LẤY LINK TỪ KKPHIM
        // =========================

        if (!videoSrc) {
          try {
            videoSrc = await fetchEpisodeUrlFromKKPhim(realSlug, episodeNum);
          } catch (error) {
            console.warn("Không lấy được link KKPhim:", error);
          }
        }

        // =========================
        // FALLBACK EPISODES.JS
        // =========================

        if (!videoSrc) {
          try {
            if (window.allEpisodesData && window.allEpisodesData[realSlug]) {
              const fallback = window.allEpisodesData[realSlug];

              if (fallback[episodeNum]) {
                videoSrc =
                  typeof fallback[episodeNum] === "string"
                    ? fallback[episodeNum]
                    : fallback[episodeNum].url;
              }
            }
          } catch (error) {
            console.warn("Fallback Episodes.js lỗi:", error);
          }
        }

        if (!videoSrc) {
          console.error("Không tìm thấy link video!");

          return;
        }

        console.log("🎬 Video source:", videoSrc);

        // =========================
        // HLS
        // =========================

        let hls = null;

        if (typeof Hls !== "undefined" && Hls.isSupported()) {
          hls = new Hls();

          hls.loadSource(videoSrc);

          hls.attachMedia(video);

          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            console.log("✅ HLS manifest loaded");
          });

          hls.on(Hls.Events.ERROR, (event, data) => {
            console.error("HLS error:", data);
          });
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = videoSrc;
        } else {
          video.src = videoSrc;
        }

        // =========================
        // PLYR
        // =========================

        let player = null;

        if (typeof Plyr !== "undefined") {
          player = new Plyr(video, {
            controls: [
              "play-large",
              "rewind",
              "play",
              "fast-forward",
              "progress",
              "current-time",
              "duration",
              "mute",
              "volume",
              "settings",
              "pip",
              "fullscreen",
            ],

            settings: ["quality", "speed"],

            // Nút tua lùi / tới 10 giây (phím ← → cũng tua 10s)
            seekTime: 10,

            // Phím tắt do mình tự xử lý ở dưới (hoạt động toàn trang)
            keyboard: { focused: false, global: false },

            autoplay: false,
          });
        }

        // =========================
        // WATCH HISTORY
        // =========================

        const WATCH_HISTORY_KEY = "continue_watching_list";

        // Kho riêng: lưu vị trí xem của TỪNG TẬP (không hiện ra ngoài trang chủ)
        const EP_POSITIONS_KEY = "episode_positions";

        function getEpisodePositions() {
          try {
            const raw = localStorage.getItem(EP_POSITIONS_KEY);
            const parsed = raw ? JSON.parse(raw) : {};
            return parsed && typeof parsed === "object" ? parsed : {};
          } catch (e) {
            return {};
          }
        }

        function movieKey() {
          return String(realSlug || realTitle || "");
        }

        let hasRestoredPosition = false;

        let lastHistorySave = 0;

        function getWatchHistory() {
          try {
            const raw = localStorage.getItem(WATCH_HISTORY_KEY);

            if (!raw) {
              return [];
            }

            const parsed = JSON.parse(raw);

            return Array.isArray(parsed) ? parsed : [];
          } catch (error) {
            console.error("Không đọc được lịch sử xem:", error);

            return [];
          }
        }

        function saveWatchHistory() {
          try {
            if (!video || !isFinite(video.duration) || video.duration <= 0) {
              return;
            }

            const currentTime = Number(video.currentTime);

            const duration = Number(video.duration);

            if (!isFinite(currentTime) || currentTime < 1) {
              return;
            }

            const progress = Math.min(
              100,
              Math.max(0, Math.round((currentTime / duration) * 100)),
            );

            let history = getWatchHistory();

            // Mỗi PHIM chỉ giữ 1 bản ghi (tập xem gần nhất)
            const sameMovie = (item) =>
              realSlug
                ? String(item.slug || "") === String(realSlug)
                : item.title === realTitle;
            history = history.filter((item) => !sameMovie(item));

            const watchItem = {
              title: realTitle,

              slug: realSlug,

              poster: realPoster,

              desc: movieObj ? movieObj.desc || "" : "",

              episode: episodeNum,

              totalEpisodes: totalEp,

              progress,

              currentTime,

              duration,

              updatedAt: Date.now(),
            };

            history.unshift(watchItem);

            history = history.slice(0, 30);

            localStorage.setItem(WATCH_HISTORY_KEY, JSON.stringify(history));

            // Lưu vị trí riêng cho tập này (giữ lại tất cả các tập)
            const positions = getEpisodePositions();
            const key = movieKey();
            positions[key] = positions[key] || {};
            positions[key][String(episodeNum)] = {
              currentTime,
              duration,
              progress,
              updatedAt: Date.now(),
            };
            localStorage.setItem(EP_POSITIONS_KEY, JSON.stringify(positions));

            console.log("✅ Đã lưu lịch sử xem:", watchItem);
          } catch (error) {
            console.error("❌ Không lưu được lịch sử xem:", error);
          }
        }

        // =========================
        // KHÔI PHỤC VỊ TRÍ
        // =========================

        function restoreWatchPosition() {
          if (hasRestoredPosition) {
            return;
          }

          if (!video || !isFinite(video.duration) || video.duration <= 0) {
            return;
          }

          try {
            const positions = getEpisodePositions();
            let saved =
              positions[movieKey()] &&
              positions[movieKey()][String(episodeNum)];

            // Dự phòng: dữ liệu cũ chỉ có trong danh sách Tiếp tục xem
            if (!saved) {
              saved = getWatchHistory().find(
                (item) =>
                  String(item.slug || item.title || "") === movieKey() &&
                  Number(item.episode) === Number(episodeNum),
              );
            }

            hasRestoredPosition = true;

            if (!saved) {
              return;
            }

            const savedTime = Number(saved.currentTime) || 0;

            if (savedTime > 5 && savedTime < video.duration - 10) {
              video.currentTime = Math.min(savedTime, video.duration - 10);

              console.log(
                `▶ Khôi phục Tập ${episodeNum} tại ${Math.floor(
                  savedTime,
                )} giây`,
              );
            }
          } catch (error) {
            hasRestoredPosition = true;

            console.error("Không khôi phục được vị trí xem:", error);
          }
        }

        video.addEventListener("loadedmetadata", restoreWatchPosition);

        video.addEventListener("durationchange", restoreWatchPosition);

        video.addEventListener("canplay", restoreWatchPosition);

        // =========================
        // LƯU TỰ ĐỘNG MỖI 5 GIÂY
        // =========================

        video.addEventListener("timeupdate", () => {
          const now = Date.now();

          if (now - lastHistorySave >= 5000) {
            lastHistorySave = now;

            saveWatchHistory();
          }
        });

        // =========================
        // LƯU KHI PAUSE
        // =========================

        video.addEventListener("pause", saveWatchHistory);

        // =========================
        // LƯU KHI SEEK
        // =========================

        video.addEventListener("seeked", saveWatchHistory);

        // =========================
        // NÚT BỎ QUA INTRO
        // =========================
        // Điền thời gian intro theo từng phim (đơn vị: giây).
        // Key = slug của phim. start/end áp dụng cho mọi tập.
        // Muốn riêng từng tập thì thêm: episodes: { 3: { start: 10, end: 100 } }
        // Phim nào chưa điền sẽ dùng DEFAULT_INTRO bên dưới.
        const INTRO_TIMES = {
          // "ten-slug-phim": { start: 0, end: 90 },
        };
        const DEFAULT_INTRO = { start: 0, end: 90 };

        function getIntroRange() {
          const cfg = INTRO_TIMES[realSlug];
          if (!cfg) return DEFAULT_INTRO;
          const epCfg = cfg.episodes && cfg.episodes[episodeNum];
          return epCfg || cfg;
        }

        (function setupSkipIntro() {
          const style = document.createElement("style");
          style.textContent = `
            .skip-intro-btn {
              position: absolute; right: 20px; bottom: 70px; z-index: 5;
              padding: 10px 18px; border: 1px solid rgba(255,255,255,.7);
              border-radius: 6px; background: rgba(0,0,0,.65); color: #fff;
              font-size: 15px; font-weight: 600; cursor: pointer; display: none;
            }
            .skip-intro-btn:hover { background: #fff; color: #000; }
            .skip-intro-btn.show { display: block; }
          `;
          document.head.appendChild(style);

          const btn = document.createElement("button");
          btn.className = "skip-intro-btn";
          btn.textContent = "Bỏ qua intro ⏭";

          // Gắn vào trong khung Plyr để vẫn hiện khi fullscreen
          const host = player ? player.elements.container : video.parentElement;
          host.appendChild(btn);

          btn.addEventListener("click", () => {
            video.currentTime = getIntroRange().end;
            btn.classList.remove("show");
          });

          video.addEventListener("timeupdate", () => {
            const { start, end } = getIntroRange();
            const t = video.currentTime;
            btn.classList.toggle("show", t >= start && t < end - 1);
          });
        })();

        // =========================
        // CÔNG CỤ ĐO INTRO (chỉ hiện khi URL có &introtool=1)
        // =========================
        // Cách dùng: mở tập phim, thêm &introtool=1 vào cuối URL, tua tới lúc
        // intro bắt đầu bấm "Đặt START", tua tới lúc intro kết thúc bấm "Đặt END",
        // rồi copy dòng hiện ra dán vào INTRO_TIMES ở trên.
        if (new URLSearchParams(location.search).get("introtool") === "1") {
          const panel = document.createElement("div");
          panel.style.cssText =
            "position:absolute;top:10px;right:10px;z-index:9;background:rgba(0,0,0,.8);" +
            "color:#fff;padding:10px;border-radius:8px;font-size:13px;width:290px;";
          panel.innerHTML = `
            <div>Hiện tại: <b id="it-now">0</b>s</div>
            <div style="margin:6px 0;display:flex;gap:6px">
              <button id="it-start" style="flex:1;cursor:pointer">Đặt START</button>
              <button id="it-end" style="flex:1;cursor:pointer">Đặt END</button>
            </div>
            <input id="it-out" readonly style="width:100%;box-sizing:border-box;font-size:12px" />
          `;
          (player
            ? player.elements.container
            : video.parentElement
          ).appendChild(panel);

          let itStart = 0;
          let itEnd = 0;
          const out = panel.querySelector("#it-out");
          const refresh = () => {
            out.value = `"${realSlug}": { start: ${itStart}, end: ${itEnd} },`;
          };
          refresh();

          video.addEventListener("timeupdate", () => {
            panel.querySelector("#it-now").textContent = Math.floor(
              video.currentTime,
            );
          });
          panel.querySelector("#it-start").onclick = () => {
            itStart = Math.floor(video.currentTime);
            refresh();
          };
          panel.querySelector("#it-end").onclick = () => {
            itEnd = Math.ceil(video.currentTime);
            refresh();
          };
          out.addEventListener("click", () => {
            out.select();
            try {
              navigator.clipboard.writeText(out.value);
            } catch (e) {}
          });
        }

        // =========================
        // LƯU KHI ĐỔI TAB
        // =========================

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden") {
            saveWatchHistory();
          }
        });

        // =========================
        // LƯU KHI ĐÓNG TRANG
        // =========================

        window.addEventListener("beforeunload", saveWatchHistory);

        // =========================
        // AUTO NEXT
        // =========================

        const AUTONEXT_KEY = "autonext_enabled";
        const AUTONEXT_COUNT_KEY = "autonext_count";
        const MAX_AUTO_EPISODES = 3; // tối đa 3 tập tự chuyển liên tiếp nếu không tương tác

        const autoNextToggle = document.getElementById("wp-autonext-toggle");

        // Mặc định TẮT, nhớ theo lựa chọn của người dùng
        autoNextToggle.checked = localStorage.getItem(AUTONEXT_KEY) === "1";
        autoNextToggle.addEventListener("change", () => {
          localStorage.setItem(
            AUTONEXT_KEY,
            autoNextToggle.checked ? "1" : "0",
          );
        });

        // Người dùng còn thao tác thì reset bộ đếm (chống ngủ quên)
        const resetAutoCount = () =>
          sessionStorage.setItem(AUTONEXT_COUNT_KEY, "0");
        ["pointerdown", "keydown", "touchstart"].forEach((evt) =>
          window.addEventListener(evt, resetAutoCount, { passive: true }),
        );

        video.addEventListener("ended", () => {
          saveWatchHistory();

          if (!autoNextToggle.checked || episodeNum >= totalEp) return;

          const count = Number(sessionStorage.getItem(AUTONEXT_COUNT_KEY) || 0);
          if (count >= MAX_AUTO_EPISODES) return; // dừng lại, chờ người dùng bấm

          sessionStorage.setItem(AUTONEXT_COUNT_KEY, String(count + 1));
          goToEpisode(episodeNum + 1);
        });

        // =========================
        // PHÍM TẮT
        // F: toàn màn hình | ← →: tua 10s | ↑ ↓: tăng/giảm âm | Space/K: phát/dừng | M: tắt tiếng
        // =========================
        document.addEventListener("keydown", (e) => {
          // Không bắt phím khi đang gõ chữ hoặc bấm tổ hợp Ctrl/Alt/Cmd
          // Chỉ bỏ qua khi đang gõ chữ. Thanh tua / thanh âm lượng (input range),
          // checkbox, nút bấm... vẫn dùng phím tắt, và ta chặn hành vi mặc định
          // của chúng để không bị tua / đổi âm lượng 2 lần.
          const t = e.target;
          const TEXT_TYPES = [
            "text",
            "search",
            "email",
            "url",
            "tel",
            "password",
            "number",
          ];
          if (
            t &&
            (t.tagName === "TEXTAREA" ||
              t.tagName === "SELECT" ||
              t.isContentEditable ||
              (t.tagName === "INPUT" && TEXT_TYPES.includes(t.type)))
          ) {
            return;
          }
          if (e.ctrlKey || e.altKey || e.metaKey) return;

          const showToast = (text) => {
            let toast = document.getElementById("key-toast");
            if (!toast) {
              toast = document.createElement("div");
              toast.id = "key-toast";
              toast.style.cssText =
                "position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);" +
                "background:rgba(0,0,0,.7);color:#fff;padding:10px 18px;border-radius:8px;" +
                "font-size:18px;font-weight:600;z-index:8;pointer-events:none;" +
                "opacity:0;transition:opacity .2s;";
              (player
                ? player.elements.container
                : video.parentElement
              ).appendChild(toast);
            }
            toast.textContent = text;
            toast.style.opacity = "1";
            clearTimeout(toast._t);
            toast._t = setTimeout(() => (toast.style.opacity = "0"), 700);
          };

          switch (e.key) {
            case "f":
            case "F":
              e.preventDefault();
              if (player) {
                player.fullscreen.toggle();
              } else if (document.fullscreenElement) {
                document.exitFullscreen();
              } else {
                video.requestFullscreen();
              }
              break;

            case "ArrowLeft":
              e.preventDefault();
              video.currentTime = Math.max(0, video.currentTime - 10);
              showToast("⏪ -10s");
              break;

            case "ArrowRight":
              e.preventDefault();
              video.currentTime = Math.min(
                video.duration || Infinity,
                video.currentTime + 10,
              );
              showToast("+10s ⏩");
              break;

            case "ArrowUp":
              e.preventDefault();
              video.muted = false;
              video.volume = Math.min(
                1,
                Math.round((video.volume + 0.1) * 10) / 10,
              );
              showToast("🔊 " + Math.round(video.volume * 100) + "%");
              break;

            case "ArrowDown":
              e.preventDefault();
              video.volume = Math.max(
                0,
                Math.round((video.volume - 0.1) * 10) / 10,
              );
              showToast(
                video.volume === 0
                  ? "🔇 0%"
                  : "🔉 " + Math.round(video.volume * 100) + "%",
              );
              break;

            case " ":
            case "k":
            case "K":
              e.preventDefault();
              if (video.paused) video.play().catch(() => {});
              else video.pause();
              break;

            case "m":
            case "M":
              video.muted = !video.muted;
              showToast(video.muted ? "🔇 Tắt tiếng" : "🔊 Bật tiếng");
              break;
          }
        });

        document.addEventListener("keyup", (e) => {
          if (e.key === " " && e.target && e.target.tagName === "BUTTON") {
            e.preventDefault();
          }
        });

        // =========================
        // NÚT TẬP TRƯỚC / TẬP SAU TRONG THANH ĐIỀU KHIỂN
        // =========================
        (function addEpisodeButtonsToPlayer() {
          if (!player) return;
          const controls =
            player.elements.container.querySelector(".plyr__controls");
          const rewindBtn =
            controls && controls.querySelector('[data-plyr="rewind"]');
          const forwardBtn =
            controls && controls.querySelector('[data-plyr="fast-forward"]');
          if (!controls || !rewindBtn || !forwardBtn) return;

          const makeBtn = (iconClass, label, onClick) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "plyr__control";
            b.title = label;
            b.setAttribute("aria-label", label);
            b.innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
            b.addEventListener("click", onClick);
            return b;
          };

          if (episodeNum > 1) {
            controls.insertBefore(
              makeBtn("fa-backward-step", "Tập trước", () =>
                goToEpisode(episodeNum - 1),
              ),
              rewindBtn,
            );
          }

          if (episodeNum < totalEp) {
            forwardBtn.after(
              makeBtn("fa-forward-step", "Tập sau", () =>
                goToEpisode(episodeNum + 1),
              ),
            );
          }
        })();

        // =========================
        // TĂNG ÂM LƯỢNG VƯỢT 100% (nút x1 / x1.5 / x2 / x3, phím B)
        // =========================
        (function setupVolumeBoost() {
          if (!player || !hls) return; // chỉ dùng khi phát bằng HLS (tránh lỗi CORS gây mất tiếng)

          const BOOST_KEY = "audio_boost";
          const LEVELS = [1, 1.5, 2, 3];
          let level = Number(localStorage.getItem(BOOST_KEY)) || 1;
          if (!LEVELS.includes(level)) level = 1;

          let audioCtx = null;
          let gainNode = null;

          function ensureAudio() {
            if (audioCtx) return true;
            try {
              const AC = window.AudioContext || window.webkitAudioContext;
              audioCtx = new AC();
              const source = audioCtx.createMediaElementSource(video);
              gainNode = audioCtx.createGain();
              // Bộ nén nhẹ để âm lớn không bị rè / vỡ tiếng
              const comp = audioCtx.createDynamicsCompressor();
              source
                .connect(gainNode)
                .connect(comp)
                .connect(audioCtx.destination);
              return true;
            } catch (err) {
              console.warn("Không bật được tăng âm lượng:", err);
              audioCtx = null;
              return false;
            }
          }

          function applyBoost() {
            if (level > 1 || audioCtx) {
              if (!ensureAudio()) return;
              if (audioCtx.state === "suspended") audioCtx.resume();
              gainNode.gain.value = level;
            }
          }

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "plyr__control";
          btn.style.cssText = "font-weight:700;font-size:13px;min-width:40px;";

          function refreshBtn() {
            btn.textContent = "x" + level;
            btn.title = "Tăng âm lượng (phím B)";
            btn.setAttribute("aria-label", "Tăng âm lượng, hiện tại x" + level);
          }

          function cycle() {
            level = LEVELS[(LEVELS.indexOf(level) + 1) % LEVELS.length];
            localStorage.setItem(BOOST_KEY, String(level));
            applyBoost();
            refreshBtn();
          }

          btn.addEventListener("click", cycle);
          refreshBtn();

          const volInput = player.elements.container.querySelector(
            'input[data-plyr="volume"]',
          );
          if (volInput) volInput.after(btn);
          else player.elements.controls.appendChild(btn);

          // Phím B để đổi mức tăng âm
          document.addEventListener("keydown", (e) => {
            const t = e.target;
            if (
              t &&
              (t.tagName === "TEXTAREA" ||
                t.tagName === "SELECT" ||
                t.isContentEditable ||
                (t.tagName === "INPUT" &&
                  [
                    "text",
                    "search",
                    "email",
                    "url",
                    "tel",
                    "password",
                    "number",
                  ].includes(t.type)))
            )
              return;
            if (e.ctrlKey || e.altKey || e.metaKey) return;
            if (e.key === "b" || e.key === "B") cycle();
          });

          // Trình duyệt chỉ cho bật âm thanh sau lần tương tác đầu tiên:
          // nếu lần trước đã chọn x2/x3 thì áp dụng lại ngay khi người dùng chạm vào trang
          if (level > 1) {
            const once = () => {
              applyBoost();
              window.removeEventListener("pointerdown", once);
              window.removeEventListener("keydown", once);
            };
            window.addEventListener("pointerdown", once);
            window.addEventListener("keydown", once);
          }
        })();

        // =========================
        // PLAY VIDEO
        // =========================

        try {
          await video.play();
        } catch (error) {
          console.log("Autoplay bị trình duyệt chặn. Hãy bấm Play.");
        }
      })();
    </script>
  </body>
</html>
